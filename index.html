<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>抽籤系統</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      min-height: 100vh;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 16px 60px;
    }

    h1 {
      font-size: 2.2rem;
      letter-spacing: 6px;
      color: #ffd700;
      text-shadow: 0 0 24px rgba(255,215,0,0.5);
      margin-bottom: 6px;
    }

    .subtitle { color: #718096; font-size: 0.9rem; margin-bottom: 48px; letter-spacing: 1px; }

    /* ---- Two-column layout ---- */
    .columns {
      display: flex;
      gap: 28px;
      width: 100%;
      max-width: 860px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .col {
      flex: 1;
      min-width: 280px;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    /* ---- Panel ---- */
    .panel {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 18px;
      padding: 24px 20px;
      backdrop-filter: blur(12px);
    }

    .panel-title {
      font-size: 0.78rem;
      letter-spacing: 2px;
      color: #90cdf4;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step-badge {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 800;
      flex-shrink: 0;
    }

    /* ---- Drum ---- */
    .drum-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
    }

    .drum {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 3px solid #ffd700;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px;
      position: relative;
      box-shadow: 0 0 24px rgba(255,215,0,0.15);
      transition: box-shadow 0.3s;
    }

    .drum.spinning {
      animation: glow-pulse 0.35s ease-in-out infinite alternate;
    }

    @keyframes glow-pulse {
      from { box-shadow: 0 0 20px rgba(255,215,0,0.2); }
      to   { box-shadow: 0 0 60px rgba(255,215,0,0.8); }
    }

    .drum.locked {
      border-color: #68d391;
      box-shadow: 0 0 28px rgba(104,211,145,0.35);
    }

    .drum-text {
      font-size: 0.95rem;
      color: #a0aec0;
      line-height: 1.5;
      transition: opacity 0.1s;
    }

    .drum.spinning .drum-text { animation: flicker 0.12s steps(1) infinite; }

    @keyframes flicker { 50% { opacity: 0.2; } }

    /* ---- Result tag ---- */
    .result-tag {
      font-size: 1.05rem;
      font-weight: 700;
      padding: 10px 22px;
      border-radius: 28px;
      text-align: center;
      animation: pop-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .result-tag.mode-tag {
      background: linear-gradient(135deg, #f6d365, #fda085);
      color: #1a1a2e;
    }

    .result-tag.map-tag {
      background: linear-gradient(135deg, #a8edea, #fed6e3);
      color: #1a1a2e;
    }

    @keyframes pop-in {
      from { transform: scale(0.3); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    /* ---- Mode list ---- */
    .mode-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    .mode-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      font-size: 0.88rem;
      color: #a0aec0;
      transition: all 0.25s;
      cursor: default;
    }

    .mode-item.active {
      background: rgba(246,211,101,0.12);
      border-color: rgba(246,211,101,0.4);
      color: #fbd38d;
    }

    .mode-item .mode-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4a5568;
      flex-shrink: 0;
      transition: background 0.25s;
    }

    .mode-item.active .mode-dot { background: #fbd38d; }

    /* ---- Map chips ---- */
    .map-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }

    .map-chip {
      font-size: 0.82rem;
      padding: 5px 12px;
      border-radius: 16px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      color: #a0aec0;
      transition: all 0.25s;
    }

    .map-chip.winner {
      background: linear-gradient(135deg, #a8edea, #fed6e3);
      color: #1a1a2e;
      font-weight: 700;
      border-color: transparent;
      transform: scale(1.08);
    }

    /* ---- Buttons ---- */
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 2px;
      transition: all 0.2s;
    }

    .btn-mode {
      background: linear-gradient(135deg, #f6d365, #fda085);
      color: #1a1a2e;
    }

    .btn-mode:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(253,160,133,0.4); }

    .btn-map {
      background: linear-gradient(135deg, #a8edea, #fed6e3);
      color: #1a1a2e;
    }

    .btn-map:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(168,237,234,0.4); }

    .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

    .btn-reset {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: #718096;
      font-size: 0.82rem;
      letter-spacing: 1px;
      margin-top: -8px;
    }

    .btn-reset:hover { background: rgba(255,255,255,0.11); }

    /* ---- Arrow connector ---- */
    .arrow {
      font-size: 1.6rem;
      color: #4a5568;
      align-self: center;
      margin-top: 80px;
    }

    /* ---- History ---- */
    .history-wrap {
      width: 100%;
      max-width: 860px;
      margin-top: 32px;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 200px;
      overflow-y: auto;
    }

    .history-item {
      background: rgba(255,255,255,0.04);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #a0aec0;
    }

    .history-item .hr-round { color: #ffd700; font-weight: 700; min-width: 36px; }
    .history-item .hr-mode  { color: #fbd38d; }
    .history-item .hr-sep   { color: #4a5568; }
    .history-item .hr-map   { color: #b2f5ea; }

    .empty-hint { color: #4a5568; font-size: 0.85rem; text-align: center; padding: 10px; }

    /* ---- Waiting hint ---- */
    .waiting-hint {
      color: #4a5568;
      font-size: 0.85rem;
      text-align: center;
      padding: 16px 0 4px;
    }
  </style>
</head>
<body>

  <h1>抽 籤</h1>
  <p class="subtitle">先抽模式，再抽地圖</p>

  <div class="columns">

    <!-- Col 1: Mode draw -->
    <div class="col">
      <div class="panel">
        <div class="panel-title"><span class="step-badge">1</span>抽模式</div>
        <div class="drum-wrap">
          <div class="drum" id="modeDrum">
            <div class="drum-text" id="modeDrumText">按下抽籤<br>決定模式</div>
          </div>
          <div id="modeResultWrap" style="display:none">
            <div class="result-tag mode-tag" id="modeResultTag"></div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">模式清單</div>
        <div class="mode-list" id="modeList"></div>
      </div>

      <button class="btn btn-mode" id="btnMode" onclick="drawMode()">抽模式</button>
      <button class="btn btn-reset" onclick="resetAll()">重置全部</button>
    </div>

    <!-- Arrow -->
    <div class="arrow">&#8594;</div>

    <!-- Col 2: Map draw -->
    <div class="col">
      <div class="panel">
        <div class="panel-title"><span class="step-badge">2</span>抽地圖</div>
        <div class="drum-wrap">
          <div class="drum" id="mapDrum">
            <div class="drum-text" id="mapDrumText">請先<br>完成模式抽籤</div>
          </div>
          <div id="mapResultWrap" style="display:none">
            <div class="result-tag map-tag" id="mapResultTag"></div>
          </div>
        </div>
      </div>

      <div class="panel" id="mapPanel">
        <div class="panel-title">可選地圖</div>
        <div class="waiting-hint" id="mapWaitHint">等待模式抽籤完成…</div>
        <div class="map-chips" id="mapChips"></div>
      </div>

      <button class="btn btn-map" id="btnMap" onclick="drawMap()" disabled>抽地圖</button>
    </div>

  </div>

  <!-- History -->
  <div class="history-wrap">
    <div class="panel">
      <div class="panel-title">抽籤紀錄</div>
      <div class="history-list" id="historyList">
        <div class="empty-hint">尚無紀錄</div>
      </div>
    </div>
  </div>

<script>
  const DATA = [
    { mode: '寶石爭奪賽', maps: ['寶石要塞', '地下礦坑', '水晶遊戲場'] },
    { mode: '亂鬥足球',   maps: ['三重威脅', '中心舞台', '夢幻彈珠'] },
    { mode: '據點搶奪賽', maps: ['避稅區',   '平行遊戲', '金色海灣'] },
    { mode: '積分爭奪賽', maps: ['1點35',    '步行熱沙', '時光飛逝'] },
    { mode: '極限淘汰賽', maps: ['空曠荒野', '搖滾蓓爾', '新地平線'] },
  ];

  let modePool = DATA.map(d => d.mode);   // remaining modes
  let currentMode = null;
  let currentMaps = [];
  let round = 0;
  let spinning = false;

  /* ---- Init ---- */
  function init() {
    const list = document.getElementById('modeList');
    list.innerHTML = '';
    DATA.forEach(d => {
      const el = document.createElement('div');
      el.className = 'mode-item';
      el.id = 'mode-' + d.mode;
      el.innerHTML = `<div class="mode-dot"></div><span>${d.mode}</span>`;
      list.appendChild(el);
    });
  }

  /* ---- Draw Mode ---- */
  function drawMode() {
    if (spinning) return;
    if (modePool.length === 0) { alert('所有模式都已抽過，請重置！'); return; }

    spinning = true;
    currentMode = null;
    document.getElementById('btnMode').disabled = true;
    document.getElementById('btnMap').disabled = true;
    document.getElementById('modeResultWrap').style.display = 'none';
    document.getElementById('mapResultWrap').style.display = 'none';
    document.getElementById('mapChips').innerHTML = '';
    document.getElementById('mapWaitHint').style.display = 'block';

    const drum = document.getElementById('modeDrum');
    drum.classList.remove('locked');
    drum.classList.add('spinning');

    const interval = setInterval(() => {
      const rand = modePool[Math.floor(Math.random() * modePool.length)];
      document.getElementById('modeDrumText').textContent = rand;
    }, 90);

    setTimeout(() => {
      clearInterval(interval);
      drum.classList.remove('spinning');

      const idx = Math.floor(Math.random() * modePool.length);
      currentMode = modePool[idx];
      modePool.splice(idx, 1);

      document.getElementById('modeDrumText').textContent = currentMode;
      document.getElementById('modeResultTag').textContent = currentMode;
      document.getElementById('modeResultWrap').style.display = 'block';

      // highlight active mode
      document.querySelectorAll('.mode-item').forEach(el => el.classList.remove('active'));
      document.getElementById('mode-' + currentMode).classList.add('active');

      // populate maps
      currentMaps = DATA.find(d => d.mode === currentMode).maps;
      showMapChips(currentMaps, null);
      document.getElementById('mapWaitHint').style.display = 'none';
      document.getElementById('mapDrumText').textContent = '按下抽籤\n決定地圖';
      document.getElementById('mapDrum').classList.remove('locked');

      document.getElementById('btnMap').disabled = false;
      document.getElementById('btnMode').disabled = false;
      spinning = false;
    }, 1600);
  }

  /* ---- Draw Map ---- */
  function drawMap() {
    if (spinning || !currentMode) return;

    spinning = true;
    document.getElementById('btnMode').disabled = true;
    document.getElementById('btnMap').disabled = true;
    document.getElementById('mapResultWrap').style.display = 'none';

    const drum = document.getElementById('mapDrum');
    drum.classList.remove('locked');
    drum.classList.add('spinning');

    const interval = setInterval(() => {
      const rand = currentMaps[Math.floor(Math.random() * currentMaps.length)];
      document.getElementById('mapDrumText').textContent = rand;
    }, 90);

    setTimeout(() => {
      clearInterval(interval);
      drum.classList.remove('spinning');
      drum.classList.add('locked');

      const map = currentMaps[Math.floor(Math.random() * currentMaps.length)];
      document.getElementById('mapDrumText').textContent = map;
      document.getElementById('mapResultTag').textContent = map;
      document.getElementById('mapResultWrap').style.display = 'block';

      showMapChips(currentMaps, map);

      round++;
      addHistory(round, currentMode, map);

      document.getElementById('btnMode').disabled = false;
      spinning = false;
    }, 1600);
  }

  /* ---- Helpers ---- */
  function showMapChips(maps, winner) {
    const wrap = document.getElementById('mapChips');
    wrap.innerHTML = '';
    maps.forEach(m => {
      const chip = document.createElement('div');
      chip.className = 'map-chip' + (m === winner ? ' winner' : '');
      chip.textContent = m;
      wrap.appendChild(chip);
    });
  }

  function addHistory(round, mode, map) {
    const list = document.getElementById('historyList');
    if (round === 1) list.innerHTML = '';
    const item = document.createElement('div');
    item.className = 'history-item';
    item.innerHTML = `
      <span class="hr-round">#${round}</span>
      <span class="hr-mode">${mode}</span>
      <span class="hr-sep">&#8594;</span>
      <span class="hr-map">${map}</span>
    `;
    list.insertBefore(item, list.firstChild);
  }

  function resetAll() {
    modePool = DATA.map(d => d.mode);
    currentMode = null;
    currentMaps = [];
    round = 0;
    spinning = false;

    document.querySelectorAll('.mode-item').forEach(el => el.classList.remove('active'));
    document.getElementById('modeDrumText').textContent = '按下抽籤\n決定模式';
    document.getElementById('modeDrum').classList.remove('spinning', 'locked');
    document.getElementById('modeResultWrap').style.display = 'none';

    document.getElementById('mapDrumText').textContent = '請先\n完成模式抽籤';
    document.getElementById('mapDrum').classList.remove('spinning', 'locked');
    document.getElementById('mapResultWrap').style.display = 'none';
    document.getElementById('mapChips').innerHTML = '';
    document.getElementById('mapWaitHint').style.display = 'block';

    document.getElementById('btnMode').disabled = false;
    document.getElementById('btnMap').disabled = true;

    document.getElementById('historyList').innerHTML = '<div class="empty-hint">尚無紀錄</div>';
  }

  init();
</script>

</body>
</html>
